name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the site and fail if the committed HTML is stale
        run: |
          python3 build.py
          if ! git diff --quiet; then
            echo "::error::Generated HTML differs from what build.py produces."
            echo "Run 'python3 build.py' locally and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 deploy_vercel.py
